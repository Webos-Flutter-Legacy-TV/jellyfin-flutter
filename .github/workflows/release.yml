# Builds both IPKs; on a version tag (vX.Y.Z) or a manual run, publishes a GitHub release whose
# description comes from CHANGELOG.md (tools/release.py notes). Pushes to main and pull requests
# only build and keep the IPKs as an artifact.
# Accepts the LG SDK License Agreement for the webOS NDK (WEBOS_NDK_ACCEPT_EULA=1), as
# flutter-webos's own CI does.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z, tag vX.Y.Z must exist)"
        required: true
      flutter_webos_ref:
        description: "flutter-webos branch or tag to build with"
        default: main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs curl unzip xz-utils file pkg-config cmake ninja-build clang \
            libgtk-3-dev python3 python3-venv binutils

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: flutter-webos and toolchains
        run: |
          git clone --depth 1 --branch "${{ inputs.flutter_webos_ref || 'main' }}" \
            https://github.com/Webos-Flutter-Legacy-TV/flutter-webos.git .ref/flutter-webos
          cd .ref/flutter-webos/legacy-webos && WEBOS_NDK_ACCEPT_EULA=1 ./setup.sh

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          WANT: ${{ inputs.version || github.ref_name }}
        run: tools/check-version.sh "${WANT#v}"

      - name: Build IPKs
        run: tools/release.py build --flutter-webos .ref/flutter-webos

      - name: Release notes
        run: tools/release.py notes --out dist/RELEASE_NOTES.md && cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-tv-ipk
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tools/check-version.sh)
          gh release create "v$v" --title "Jellyfin TV $v" --notes-file dist/RELEASE_NOTES.md \
            dist/*.ipk dist/*.manifest.json dist/SHA256SUMS dist/icon.png
