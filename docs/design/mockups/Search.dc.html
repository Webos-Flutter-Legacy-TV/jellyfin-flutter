<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4cc3ee}a:hover{color:#7fd4f3}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0b0d12; color: #ffffff; font-family: Inter, Roboto, sans-serif; display: grid; grid-template-columns: 620px 1fr">
  <aside style="background: #12151d; box-sizing: border-box; padding: 60px 56px; display: flex; flex-direction: column; gap: 26px; border-right: 1px solid rgba(255,255,255,0.06)">
    <div style="display: flex; align-items: center; gap: 16px">
      <a href="Home.dc.html" aria-label="Back" style="width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1d2230; color: #ffffff">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg></a>
      <h1 style="margin: 0; font-size: 40px; font-weight: 700">Search</h1>
    </div>
    <label style="display: flex; align-items: center; gap: 16px; height: 84px; padding: 0 26px; border-radius: 16px; background: #0b0d12; border: 2px solid #2c3345">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20 L16.5 16.5"></path></svg>
      <input value="dragon" aria-label="Search" style="flex: 1; border: none; background: transparent; color: #ffffff; font: inherit; font-size: 32px; font-weight: 600; outline: none">
    </label>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="36">
        <button style="height: 70px; border-radius: 12px; border: none; font: inherit; font-size: 27px; font-weight: 600; background: {{k.bg}}; color: {{k.c}}; box-shadow: {{k.ring}}">{{k.k}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <button style="height: 64px; border-radius: 12px; border: none; background: #1d2230; color: #ffffff; font: inherit; font-size: 22px; font-weight: 600">Space</button>
      <button style="height: 64px; border-radius: 12px; border: none; background: #1d2230; color: #ffffff; font: inherit; font-size: 22px; font-weight: 600">Delete</button>
      <button style="height: 64px; border-radius: 12px; border: none; background: #1d2230; color: #ffffff; font: inherit; font-size: 22px; font-weight: 600">Clear</button>
    </div>
    <span style="font-size: 20px; color: rgba(255,255,255,0.5)">Recent: lanterns · ted lasso · moana</span>
  </aside>
  <main style="box-sizing: border-box; padding: 70px 0 0 72px; display: flex; flex-direction: column; gap: 34px; overflow: hidden">
    <section style="display: flex; flex-direction: column; gap: 18px">
      <h2 style="margin: 0; font-size: 30px; font-weight: 600">Shows</h2>
      <div style="display: flex; gap: 26px">
        <div style="width: 200px; display: flex; flex-direction: column; gap: 10px">
          <div style="height: 300px; border-radius: 14px; background: #4a3a2e; position: relative; display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box"><span style="font-size: 20px; font-weight: 800">House of the Dragon</span><span style="position: absolute; right: 10px; top: 10px; min-width: 36px; height: 36px; border-radius: 18px; background: #00a4dc; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">8</span></div>
          <span style="font-size: 21px; font-weight: 600">House of the Dragon</span><span style="font-size: 18px; color: rgba(255,255,255,0.55); margin-top: -6px">2022 – present</span>
        </div>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 18px">
      <h2 style="margin: 0; font-size: 30px; font-weight: 600">Episodes</h2>
      <div style="display: flex; gap: 26px">
        <sc-for list="{{eps}}" as="e" hint-placeholder-count="3">
          <div style="width: 360px; flex: none; display: flex; flex-direction: column; gap: 10px">
            <div style="height: 202px; border-radius: 14px; background: {{e.bg}}"></div>
            <span style="font-size: 21px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.t}}</span><span style="font-size: 18px; color: rgba(255,255,255,0.55); margin-top: -6px">{{e.s}}</span>
          </div>
        </sc-for>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 18px">
      <h2 style="margin: 0; font-size: 30px; font-weight: 600">Genres</h2>
      <div style="display: flex; gap: 30px">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
          <span style="padding: 14px 26px; border-radius: 999px; background: {{p.bg}}; font-size: 22px; font-weight: 600">{{p.n}}</span>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const keys = 'abcdefghijklmnopqrstuvwxyz1234567890'.split('').map(k => ({ k, bg: k === 'n' ? '#ffffff' : '#1d2230', c: k === 'n' ? '#0b0d12' : '#ffffff', ring: k === 'n' ? '0 0 0 6px rgba(0,164,220,0.45)' : 'none' }));
return {
  keys,
  eps: [
    { t: 'The Heirs of the Dragon', s: 'House of the Dragon · S1:E1', bg: '#3a3430' },
    { t: 'The Black Queen', s: 'House of the Dragon · S1:E10', bg: '#2e2a30' },
    { t: 'The Red Dragon and the Gold', s: 'House of the Dragon · S2:E4', bg: '#3e3a2e' }
  ],
  people: [ { n: 'Sci-Fi & Fantasy', bg: '#1d2230' } ]
};
}
}
</script>
</body>
</html>
