<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio and subtitles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4cc3ee}a:hover{color:#7fd4f3}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: linear-gradient(140deg, #2c5a72 0%, #3e6e6a 50%, #a89470 100%); color: #ffffff; font-family: Inter, Roboto, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>
  <aside style="position: absolute; right: 0; top: 0; width: 760px; height: 1080px; box-sizing: border-box; padding: 80px 64px; background: rgba(15,18,25,0.96); box-shadow: -30px 0 80px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 22px">
    <nav style="display: flex; gap: 8px; padding: 8px; border-radius: 999px; background: #1d2230; align-self: flex-start">
      <a href="#" style="padding: 12px 28px; border-radius: 999px; background: #ffffff; color: #0b0d12; font-size: 24px; font-weight: 600; text-decoration: none">Audio</a>
      <a href="#" style="padding: 12px 28px; border-radius: 999px; color: rgba(255,255,255,0.8); font-size: 24px; font-weight: 600; text-decoration: none">Subtitles</a>
      <a href="#" style="padding: 12px 28px; border-radius: 999px; color: rgba(255,255,255,0.8); font-size: 24px; font-weight: 600; text-decoration: none">Quality</a>
    </nav>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
      <sc-for list="{{tracks}}" as="t" hint-placeholder-count="4">
        <button style="display: flex; align-items: center; gap: 20px; padding: 22px 26px; border-radius: 16px; font: inherit; text-align: left; color: {{t.c}}; background: {{t.bg}}; border: {{t.b}}; box-shadow: {{t.ring}}">
          <span style="width: 30px; height: 30px; border-radius: 50%; flex: none; border: 3px solid {{t.c}}; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 50%; background: {{t.dot}}"></span></span>
          <span style="display: flex; flex-direction: column; gap: 6px; flex: 1">
            <span style="font-size: 26px; font-weight: 600">{{t.n}}</span>
            <span style="font-size: 20px; opacity: 0.7">{{t.d}}</span>
          </span>
          <sc-if value="{{t.tag}}" hint-placeholder-val="{{false}}"><span style="font-size: 17px; font-weight: 700; padding: 5px 10px; border-radius: 6px; background: rgba(0,164,220,0.2); color: #4cc3ee">{{t.tag}}</span></sc-if>
        </button>
      </sc-for>
    </div>
    <p style="margin: auto 0 0; font-size: 20px; line-height: 1.5; color: rgba(255,255,255,0.55)">TrueHD has no decoder on this TV: the server turns it into Dolby Digital Plus 7.1, Atmos included, while video plays as it is.</p>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const base = { c: '#ffffff', bg: '#151922', b: '2px solid transparent', ring: 'none', dot: 'transparent', tag: '' };
return { tracks: [
  { ...base, n: 'English · TrueHD Atmos 7.1', d: 'Default · converted to Dolby Digital Plus for this TV', dot: '#ffffff', bg: '#1d2230', b: '3px solid #ffffff', ring: '0 0 0 8px rgba(0,164,220,0.35)', tag: 'SELECTED' },
  { ...base, n: 'English · Dolby Digital Plus 5.1', d: 'Plays as it is', tag: 'DIRECT' },
  { ...base, n: 'English · AAC stereo', d: 'Commentary' },
  { ...base, n: 'Hindi · Dolby Digital 5.1', d: 'Plays as it is', tag: 'DIRECT' }
]};
}
}
</script>
</body>
</html>
